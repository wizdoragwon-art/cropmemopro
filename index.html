<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Crop Memo Pro</title>
<meta name="theme-color" content="#639922">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CropMemo">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- 홈 -->
  <section id="view-home" class="view on"></section>
  <!-- 야장 수집 -->
  <section id="view-collect" class="view"></section>
  <!-- 내보내기 -->
  <section id="view-export" class="view"></section>
  <!-- 분석 -->
  <section id="view-analysis" class="view"></section>
  <!-- 설정 -->
  <section id="view-settings" class="view"></section>
  <!-- 새 과제 생성 -->
  <section id="view-new" class="view"></section>
  <!-- 과제 수정 -->
  <section id="view-genedit" class="view"></section>
  <!-- 라벨 일괄등록 -->
  <section id="view-bulk" class="view"></section>
  <!-- 라벨 OCR 스캔 -->
  <section id="view-ocr" class="view"></section>
  <!-- 문자형 손글씨/그리기 -->
  <section id="view-write" class="view"></section>
  <!-- 사진 -->
  <section id="view-photo" class="view"></section>
  <!-- 그리기(주석) -->
  <section id="view-draw" class="view"></section>
  <!-- 음성 -->
  <section id="view-voice" class="view"></section>
  <!-- 사용자 등록 -->
  <section id="view-signup" class="view"></section>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-view="home"><i class="ti ti-home" style="font-size:22px"></i>홈</button>
    <button class="tab" data-view="collect"><i class="ti ti-clipboard-list" style="font-size:22px"></i>조사</button>
    <button class="tab" data-view="analysis"><i class="ti ti-chart-bar" style="font-size:22px"></i>분석</button>
    <button class="tab" data-view="export"><i class="ti ti-file-export" style="font-size:22px"></i>내보내기</button>
    <button class="tab" data-view="settings"><i class="ti ti-settings" style="font-size:22px"></i>설정</button>
  </nav>
</div>
<div id="toast" class="toast"></div>

<script src="native-bridge.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<script>
  // 안드로이드 앱(네이티브)에서는 자원이 APK 안에 있어 서비스워커가 필요 없다.
  // (앱을 업데이트해도 예전 캐시가 남아 옛 화면이 뜨는 문제를 막기 위해 등록하지 않음)
  if (!window.CM_NATIVE && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      var REG = null, last = 0;
      // 새 버전 확인 — 앱을 열 때와, 다른 앱에 갔다 돌아올 때만 한다.
      //   (인터넷이 다시 연결될 때·앱을 계속 켜 둘 때는 확인하지 않는다 — 사용자 요청)
      // 돌아올 때 visibilitychange 와 focus 가 거의 동시에 울리므로 3초 안의 중복만 걸러낸다.
      // (확인은 sw.js 한 개만 받아 보는 가벼운 일이라 자료 요금에 거의 영향이 없다)
      function check(force) {
        if (!REG || !navigator.onLine) return;
        var now = Date.now();
        if (!force && now - last < 3000) return;
        last = now;
        try { REG.update(); } catch (e) {}
      }
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(function (reg) { REG = reg; check(true); })      // 앱을 열 때
        .catch(function (e) { console.warn('SW 등록 실패', e); });
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      window.addEventListener('focus', function () { check(); });
      // 새 버전이 자리를 잡으면 화면을 한 번만 다시 불러온다.
      // 글을 쓰는 중이면 그 칸을 벗어날 때까지 기다린다 (조사값은 이미 저장돼 있어 사라지지 않는다).
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloaded) return; reloaded = true;
        var go = function () { location.reload(); };
        var el = document.activeElement;
        if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) el.addEventListener('blur', function () { setTimeout(go, 150); }, { once: true });
        else go();
      });
    });
  }
</script>
</body>
</html>
